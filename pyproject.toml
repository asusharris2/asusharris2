[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seedance-video-gen"
version = "0.1.0"
description = "Production-ready async AI video generation CLI using fal.ai Seedance 2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.1",
  "typer>=0.12.3",
]

[project.scripts]
seedance = "seedance_video_gen.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
